[pytest]
# Pin collection to tests/ so a bare `pytest` never walks the rest of the
# working directory. A checkout may have symlinks or large unrelated
# directories at its root; without this, collection can descend into them and
# hang. testpaths applies whenever no path is given on the command line.
testpaths = tests

# Put the repo root on sys.path so tests can `import rcmgr` / `import mwsync`
# under the `pytest` entry point. (The `python -m pytest` form adds the current
# directory automatically; the `pytest` console script does not.)
pythonpath = .
